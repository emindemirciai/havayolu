name: CI

on:
  pull_request:
  push:
    branches: [main]

# PR çalışmaları yeni commit gelince iptal edilir; main çalışmaları iptal edilmez
# (buradan çağrılan deploy işi yarıda kesilmesin diye).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  EXTERNAL_PROVIDERS_DISABLED: 'true'

jobs:
  # Yalnızca mobil uygulama ya da belge değiştiyse yayın yapılmaz (infra.md → ci.yml).
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      deploy: ${{ steps.filter.outputs.deploy }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          predicate-quantifier: every
          filters: |
            deploy:
              - '**'
              - '!apps/mobile/**'
              - '!docs/**'

  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Lint workflows
        run: >-
          docker run --rm -v "$PWD:/repo" -w /repo
          rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
          -color

  checks:
    name: checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_ENV: test
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format
        run: pnpm run format:check
      - name: Line endings
        run: pnpm run check:eol
      - name: Changelog and version
        run: pnpm run changelog:check
      - name: Scripts typecheck
        run: pnpm run typecheck:scripts
      - name: Compose guard
        run: pnpm run compose:guard
      - name: Deploy script tests (stub Dokploy, fake clock)
        run: pnpm run test:scripts
      - name: Lint, typecheck, test, build
        run: pnpm exec turbo run lint typecheck test build

  test-integration:
    name: test-integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Start PostGIS, Redis (queue, live) and Mailpit
        run: docker compose -f docker-compose.dev.yml up -d --wait --wait-timeout 300
      - name: Integration tests
        run: pnpm run test:integration
      - name: Service logs on failure
        if: failure()
        run: docker compose -f docker-compose.dev.yml logs --tail 200

  # Yalnızca main'e push'ta ve bütün kontroller yeşilken. Dokploy kurulumu bitene kadar
  # (DEPLOY_ENABLED) imajlar derlenir, yayın adımı özetle atlanır.
  deploy:
    name: deploy
    needs: [changes, checks, test-integration, actionlint]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.deploy == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
