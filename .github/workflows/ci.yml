name: CI

on:
  pull_request:
  push:
    branches: [main]

# PR çalışmaları yeni commit gelince iptal edilir; main çalışmaları iptal edilmez
# (M1b'de buradan çağrılacak deploy işi yarıda kesilmesin diye).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  EXTERNAL_PROVIDERS_DISABLED: 'true'

jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_ENV: test
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format
        run: pnpm run format:check
      - name: Line endings
        run: pnpm run check:eol
      - name: Changelog and version
        run: pnpm run changelog:check
      - name: Scripts typecheck
        run: pnpm run typecheck:scripts
      - name: Compose guard
        run: pnpm run compose:guard
      - name: Lint, typecheck, test, build
        run: pnpm exec turbo run lint typecheck test build

  test-integration:
    name: test-integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Start PostGIS, Redis (queue, live) and Mailpit
        run: docker compose -f docker-compose.dev.yml up -d --wait --wait-timeout 300
      - name: Integration tests
        run: pnpm run test:integration
      - name: Service logs on failure
        if: failure()
        run: docker compose -f docker-compose.dev.yml logs --tail 200
