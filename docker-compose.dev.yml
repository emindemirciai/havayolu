# Yerel geliştirme altyapısı. Uygulamalar `pnpm dev` ile makinede çalışır.
#   docker compose -f docker-compose.dev.yml up -d --wait --wait-timeout 300
# Portlar bu makinedeki diğer projelerle çakışmasın diye 55xxx/56xxx/58xxx aralığındadır
# (3000–3003 başka projenin). Değerler .env.example'daki geliştirme varsayılanlarıyla aynıdır.
name: havayolu-dev

services:
  postgres:
    image: postgis/postgis:18-3.6
    environment:
      POSTGRES_USER: havayolu
      POSTGRES_PASSWORD: havayolu_dev_only
      POSTGRES_DB: app_dev
    ports:
      - '127.0.0.1:55432:5432'
    volumes:
      - dev_pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U havayolu -d app_dev']
      interval: 3s
      timeout: 3s
      retries: 20

  redis-queue:
    image: redis:8.10.2-alpine
    command:
      [
        redis-server,
        --requirepass,
        queue_dev_only,
        --maxmemory,
        128mb,
        --maxmemory-policy,
        noeviction,
        --appendonly,
        'yes',
      ]
    environment:
      REDISCLI_AUTH: queue_dev_only
    ports:
      - '127.0.0.1:56379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 3s
      timeout: 3s
      retries: 20

  redis-live:
    image: redis:8.10.2-alpine
    command:
      [
        redis-server,
        --requirepass,
        live_dev_only,
        --maxmemory,
        192mb,
        --maxmemory-policy,
        volatile-ttl,
        --save,
        '',
        --appendonly,
        'no',
      ]
    environment:
      REDISCLI_AUTH: live_dev_only
    ports:
      - '127.0.0.1:56380:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 3s
      timeout: 3s
      retries: 20

  mailpit:
    image: axllent/mailpit:v1.31.2
    ports:
      - '127.0.0.1:58025:8025'
      - '127.0.0.1:51025:1025'

volumes:
  dev_pgdata:
